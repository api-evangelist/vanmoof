aid: vanmoof
name: VanMoof
description: VanMoof is an Amsterdam-based e-bike company that designs and sells smart
  electric city bikes with integrated anti-theft technology, GPS tracking, and a companion
  rider app. Originally backed by Balderton Capital and relaunched after its 2023
  restructuring, VanMoof operates a connected-bike platform, but publishes no public
  developer API — the app and bike APIs are private, and existing client libraries
  are community-built and reverse-engineered.
